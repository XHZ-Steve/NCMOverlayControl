<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NCM Overlay Control</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body>
<main aria-label="网易云音乐控件"><header><span>NCM Overlay Control</span><span id="status" role="status">正在连接</span></header>
<h1 id="title">等待网易云音乐</h1><p id="artist">本地连接 · 无需登录</p>
<div class="controls" aria-label="播放操作">
<button id="previous" data-command="previous" title="上一首" aria-label="上一首" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5v14m14-14L7 12l12 7z"/></svg></button>
<button id="toggle" data-command="toggle" title="播放" aria-label="播放" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path id="play-icon" d="M8 5l11 7-11 7z"/></svg></button>
<button id="next" data-command="next" title="下一首" aria-label="下一首" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 5v14M5 5l12 7-12 7z"/></svg></button>
<button id="like" data-command="like" title="喜欢 / 取消喜欢" aria-label="喜欢" aria-pressed="false" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/></svg></button>
<button id="dislike" data-command="dislike" title="不喜欢 / 减少推荐：打开网易云原生反馈选项" aria-label="不喜欢 / 减少推荐" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M6 6l12 12"/></svg></button>
</div>
<div class="settings"><div><label for="mode">播放模式</label><select id="mode" disabled><option value="playOrder">顺序播放</option><option value="playCycle">列表循环</option><option value="playOneCycle">单曲循环</option><option value="playRandom">随机播放</option><option value="playAi">心动模式</option><option value="playFm">私人漫游</option></select></div>
<div><label for="volume">音量 · %</label><div class="volume"><button id="mute" data-command="mute" title="静音 / 恢复音量" aria-label="静音" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4L6 8H3v8h3l5 4zM16 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg></button><input id="volume" type="range" min="0" max="100" value="100" aria-label="音量" disabled><input id="volume-number" type="number" min="0" max="100" step="1" value="100" aria-label="音量百分比" aria-describedby="error" disabled></div></div></div>
<div class="transport"><label for="transport">切歌 / 播放控制</label><select id="transport"><option value="windows">Windows 媒体键</option><option value="ncm">网易云直接控制</option></select></div>
<p id="control-feedback" role="status" aria-live="polite"></p><p id="error" role="status" aria-live="polite"></p><button id="quick-connect" type="button" hidden>尝试以调试模式启动网易云</button><footer><span>XHZ_Steve</span><div><a id="settings-link" href="/settings" aria-label="打开设置">设置</a><button id="power" aria-pressed="false" title="暂停状态订阅，操作时自动恢复">暂停更新</button><button id="exit" title="关闭本地控件服务，不退出网易云">退出控件</button></div></footer></main>
<dialog id="dislike-dialog" aria-labelledby="dislike-title"><header class="feedback-header"><div><h2 id="dislike-title">减少推荐</h2></div><button id="dislike-cancel" type="button" autofocus>取消</button></header><div id="dislike-choices" role="group" aria-label="反馈选项"></div></dialog></body></html>
